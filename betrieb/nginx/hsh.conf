# Ausschnitt für den server-Block des Reverse-Proxys.
# PRODUKTION_HOST: Rechner mit MCP-Server (8765) und Web-App (8766).

    # HsH RAG MCP Server
    location /hsh/ {
        proxy_pass         http://PRODUKTION_HOST:8765/;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host 127.0.0.1:8765;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
    }

    # HsH Chatbot Web App (Streamlit)
    location /hsh-app/ {
        proxy_pass         http://PRODUKTION_HOST:8766/hsh-app/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 86400;
    }
